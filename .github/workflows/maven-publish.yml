name: Build & Release Apple Monitor

# 支持手动触发和 push 到 main 分支
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - uses: actions/checkout@v3

      # 2️⃣ 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ 打包 jar
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4️⃣ 准备 zip
      - name: Prepare zip package
        run: |
          mkdir dist
          cp target/*.jar dist/
          cp src/main/resources/config.json dist/ || echo "config.json not found, skipped"
          cp README.md dist/ || echo "README.md not found, skipped"
          zip -r apple-monitor-v${{ github.run_number }}.zip dist

      # 5️⃣ 上传到 GitHub Release
      - name: Create GitHub Release and upload zip
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: Apple Monitor v${{ github.run_number }}
          artifacts: apple-monitor-v${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
